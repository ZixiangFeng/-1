<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><title>连接小屿研究账号</title>
<style>*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f5f3ee;color:#283c38;font:16px/1.7 system-ui,sans-serif}main{max-width:460px;margin:8vh auto;padding:28px;background:white;border-radius:20px}h1{font-size:24px}input:not([type=checkbox]),button{font:inherit;padding:12px;border:1px solid #cdd7cd;border-radius:10px;width:100%;margin:8px 0}button{background:#2d6357;color:white;cursor:pointer}button:disabled{opacity:.5}#status{color:#934536}@media(max-width:500px){main{margin:20px 12px}}label{display:block}button{min-height:48px;touch-action:manipulation}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}#password,#username{font-size:16px}p{overflow-wrap:anywhere}.notice{font-size:14px;color:#52685e}</style></head>
<body><main><h1>连接小屿研究账号</h1><p>使用研究者发给你的账号。重新连接后仍会继续原有聊天。</p>
<form id="form"><label>研究账号<input id="username" autocomplete="username" autocapitalize="characters" enterkeyhint="next" spellcheck="false" required maxlength="50"></label><label>密码<input id="password" type="password" enterkeyhint="go" autocomplete="current-password" required maxlength="128"></label>
<p class="notice">授权后，小屿技能中经连接器发送的聊天和图片会交给研究后台与模型服务处理，按研究账号保存聊天、个人图库及使用记录，用于本次研究。此连接不读取你其他豆包会话。</p>
<label><input type="checkbox" id="consent" required> 我已阅读研究说明，同意连接并记录本次研究互动。</label><button id="submit">连接到豆包</button><p id="status" role="status"></p></form></main>
<script>
const base='__BASE_PATH__',params=new URLSearchParams(location.search),$=id=>document.getElementById(id);
async function post(path,body,token){const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'连接失败');return data}
if(!params.get('app_id')||!params.get('redirect_uri')){$('submit').disabled=true;$('status').textContent='请从豆包的小屿入口打开这个授权页。';const link=document.createElement('a');link.href=base+'/mobile';link.textContent='先准备我的个人表情';$('status').after(link)}
$('form').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;$('status').textContent='';let token;
try{const login=await post('/api/login',{username:$('username').value,password:$('password').value});$('password').value='';token=login.token;if(login.role!=='participant')throw Error('请使用被试账号，管理员账号不能参与聊天');const data=await post('/api/connector/authorize',{app_id:params.get('app_id'),redirect_uri:params.get('redirect_uri'),state:params.get('state')||'',code_challenge:params.get('code_challenge')||'',code_challenge_method:params.get('code_challenge_method')||'',consent:$('consent').checked},token);await post('/api/logout',{},token);token=null;location.assign(data.redirect_uri)}catch(error){$('status').textContent=error.message}finally{if(token)await post('/api/logout',{},token).catch(()=>{});$('submit').disabled=false}};
</script></body></html>
