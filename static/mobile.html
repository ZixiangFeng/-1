<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><title>小屿 · 手机准备</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#283c38;background:#f5f3ee;font-size:16px;line-height:1.55;--green:#2d6357}*{box-sizing:border-box}body{margin:0}main{width:min(100%,520px);margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin:8px 0 28px}.avatar{display:grid;place-items:center;background:#dce8ce;color:var(--green);font-size:25px;border-radius:50%;width:52px;height:52px;flex:none}h1{font-size:24px;line-height:1.3;margin:0 0 4px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.muted,small{color:#687b71}.subtitle{font-size:14px;margin:0}.card{padding:22px;border-radius:20px;background:white;margin:16px 0;border:1px solid #e7e9e0}.step{font-size:12px;letter-spacing:.08em;color:var(--green);margin-bottom:8px;font-weight:650}label{display:block;margin:16px 0 4px}input:not([type=checkbox]){display:block;width:100%;padding:13px;font:inherit;border:1px solid #cdd7cd;border-radius:10px;background:white;color:inherit;min-height:48px}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;gap:8px;font:inherit;border:0;border-radius:12px;background:var(--green);color:white;text-decoration:none;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.full{width:100%}.secondary{background:#edf0e6;color:var(--green)}.text-button{padding:8px;background:transparent;color:var(--green);min-height:44px}.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:18px 0}.check input{width:20px;height:20px;flex:none;margin:2px 0}.error{color:#9b443b;font-size:14px;overflow-wrap:anywhere}.account{display:flex;align-items:center;justify-content:space-between;gap:12px}.account span{overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.tile{position:relative;aspect-ratio:1;overflow:hidden;border-radius:12px;background:#f2f3ee;min-width:0}.tile img{display:block;width:100%;height:100%;object-fit:contain}.spinner{position:absolute;inset:0;display:grid;place-items:center;background:#ffffff80}.spinner::after{content:"";width:25px;height:25px;border:3px solid #2d63572b;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}.tile.failed{border:1px solid #b45443}.tile.failed .spinner{display:none}.tile.failed::after{content:"!";position:absolute;right:5px;bottom:5px;background:white;color:#9b443b;border-radius:50%;width:22px;height:22px;text-align:center;font-weight:bold}.note{padding:13px;background:#f4f6ef;border-radius:12px;font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.foot{font-size:12px;text-align:center;margin-top:22px;color:#687b71}a{color:var(--green)}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}:focus-visible{outline:3px solid #a6c8b8;outline-offset:3px}@media(prefers-reduced-motion:reduce){.spinner::after{animation-duration:2s}}@media(max-width:360px){main{padding-left:12px;padding-right:12px}.card{padding:18px}.grid{gap:6px}}
</style></head><body><main>
<header><div class="avatar" aria-hidden="true">屿</div><div><h1>和小屿见面前</h1><p class="subtitle muted">登录你的账号，准备喜欢的表情</p></div></header>
<section id="loginCard" class="card"><div class="step">01 · 你的账号</div><h2>登录研究账号</h2><p class="muted">使用研究者发给你的账号。聊天和表情会跟随这个账号保存。</p>
<form id="loginForm"><label for="username">账号</label><input id="username" autocomplete="username" autocapitalize="characters" spellcheck="false" enterkeyhint="next" maxlength="50" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" enterkeyhint="go" maxlength="128" required>
<label class="check"><input type="checkbox" id="consent" required><span>我已阅读研究者提供的说明，同意将研究聊天、上传的图片和使用记录按账号保存；聊天时会使用云端模型处理相关内容。</span></label><button id="loginButton" class="full" type="submit">登录</button><p id="loginError" class="error" role="status"></p></form></section>
<div id="signedIn" hidden><section class="card account"><div><small>当前研究账号</small><br><span id="accountName"></span></div><button id="logout" class="text-button">退出</button></section>
<section class="card"><div class="step">02 · 你的表情</div><h2>把喜欢的表情带过来</h2><p class="muted">可以从手机相册一次选择多张，也可以以后再添加。支持 PNG、JPG 和静态 WebP，单张不超过 6 MB。</p><p class="note">这里只保存图片。小屿会在你实际聊天使用时，慢慢了解你的表达。</p>
<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><button id="importButton" class="secondary full"><span aria-hidden="true">＋</span>从相册添加</button><div class="row"><p id="count" class="muted">还没有表情</p><button id="cancelImport" class="text-button" hidden>停止添加</button></div><p id="progress" class="muted" role="status" aria-live="polite"></p><p id="libraryError" class="error" role="status"></p><div id="grid" class="grid"></div><button id="more" class="secondary full" hidden>显示更多</button></section>
<section class="card"><div class="step">03 · 回到豆包</div><h2>在豆包里找到小屿</h2><p id="connection" class="muted"></p><p id="entryStatus" class="note">正在检查入口…</p><a id="openDoubao" class="button full" hidden rel="noopener noreferrer">在豆包中打开小屿</a><p class="muted"><small>请继续使用同一个研究账号，之前的聊天和个人表情会保留。</small></p></section></div>
<p class="foot">小屿 · 研究准备页<br>这里只做账号和图库准备，不会开始聊天。</p>
</main><script>
'use strict';
const BASE='__BASE_PATH__',$=id=>document.getElementById(id),KEY='xiaoyuMobileToken';
let token=localStorage.getItem(KEY)||'',epoch=0,items=[],shown=0,uploading=false,stopping=false,controller=null,urls=new Set();
async function api(path,body,auth=token,signal){const r=await fetch(BASE+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:body?JSON.stringify(body):undefined,signal});const d=await r.json();if(!r.ok){const e=Error(d.error||'连接失败，请稍后重试');e.status=r.status;throw e}return d}
function release(){observer.disconnect();for(const url of urls)URL.revokeObjectURL(url);urls.clear();$('grid').replaceChildren()}
function signedOut(message=''){epoch++;controller?.abort();token='';localStorage.removeItem(KEY);localStorage.removeItem(KEY+'Name');release();$('signedIn').hidden=true;$('loginCard').hidden=false;$('loginError').textContent=message;$('password').value='';$('consent').checked=false;$('progress').textContent='';$('libraryError').textContent=''}
async function setupStatus(auth){try{return await api('/api/mobile/setup',null,auth)}catch(error){if(error.status!==404)throw error;const legacy=await api('/api/state',null,auth);return {username:legacy.username,consent:!!legacy.consent,connected:false,entry_ready:false}}}
async function setup(provided){const current=epoch,d=provided||await setupStatus(token);if(current!==epoch)return;if(!d.consent)throw Error('请阅读并勾选研究说明后登录');$('accountName').textContent=d.username;$('loginCard').hidden=true;$('signedIn').hidden=false;$('connection').textContent=d.connected?'这个研究账号已连接豆包。':d.entry_ready?'请从下方入口打开小屿，并使用这个研究账号完成连接。':'尚未连接豆包。';$('entryStatus').textContent=d.entry_ready?'入口已开放，准备好就可以去聊聊了。':'豆包入口还在准备中。你可以先添加表情，开放后由研究者通知你。';$('openDoubao').hidden=!d.entry_ready;if(d.entry_ready)$('openDoubao').href=d.entry_url;else $('openDoubao').removeAttribute('href');await library()}
async function library(){const current=epoch;const d=await api('/api/library');if(current!==epoch)return;items=d.items;shown=0;release();$('count').textContent=items.length?'已保存 '+items.length+' 张表情':'还没有表情';showMore()}
function tile(){const box=document.createElement('div');box.className='tile';const ring=document.createElement('div');ring.className='spinner';ring.setAttribute('aria-label','图片加载中');box.append(ring);return box}
function showMore(){for(const item of items.slice(shown,shown+32)){const box=tile();box.dataset.asset=item.id;$('grid').append(box);observer.observe(box)}shown=Math.min(items.length,shown+32);$('more').hidden=shown>=items.length}
const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);thumbnail(e.target)}},{rootMargin:'100px'});
async function thumbnail(box){const current=epoch,auth=token;try{const r=await fetch(BASE+'/api/asset/'+encodeURIComponent(box.dataset.asset)+'/content',{headers:{Authorization:'Bearer '+auth}});if(!r.ok)throw Error('图片读取失败');const blob=await r.blob();if(current!==epoch||!box.isConnected)return;const url=URL.createObjectURL(blob);urls.add(url);const img=document.createElement('img');img.alt='个人表情';img.onload=()=>box.querySelector('.spinner')?.remove();img.onerror=()=>{box.classList.add('failed');box.setAttribute('aria-label','图片暂未载入');};img.src=url;box.prepend(img)}catch(e){if(current===epoch&&box.isConnected){box.classList.add('failed');box.setAttribute('aria-label','图片暂未载入')}}}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('无法读取这张图片'));reader.readAsDataURL(file)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='';let issued='';try{const d=await api('/api/login',{username:$('username').value.trim(),password:$('password').value},'');$('password').value='';issued=d.token;if(d.role!=='participant')throw Error('请使用研究者分配的被试账号');const status=await setupStatus(issued);if(!status.consent){await api('/api/consent',{},issued);status.consent=true}token=issued;localStorage.setItem(KEY,token);localStorage.setItem(KEY+'Name',d.username);epoch++;await setup(status);issued=''}catch(error){if(issued)await api('/api/logout',{},issued).catch(()=>{});signedOut(error.message)}finally{$('loginButton').disabled=false}};
$('logout').onclick=async()=>{if(uploading)return;const old=token;signedOut();await api('/api/logout',{},old).catch(()=>{})};
$('importButton').onclick=()=>$('files').click();$('more').onclick=showMore;$('cancelImport').onclick=()=>{stopping=true;controller?.abort()};
$('files').onchange=async e=>{const files=Array.from(e.target.files);e.target.value='';if(!files.length||uploading)return;const current=epoch,auth=token;uploading=true;stopping=false;$('logout').disabled=true;$('importButton').disabled=true;$('cancelImport').hidden=false;$('libraryError').textContent='';release();const previews=files.map(file=>{const box=tile(),img=document.createElement('img');img.alt='所选表情';const url=URL.createObjectURL(file);urls.add(url);img.src=url;box.prepend(img);$('grid').append(box);return box});let saved=0,duplicates=0,failed=0;
try{for(let i=0;i<files.length;i++){if(stopping||current!==epoch)break;$('progress').textContent='已完成 '+i+' / '+files.length;controller=new AbortController();try{if(files[i].size>6000000)throw Error('图片超过 6 MB');const image=await readFile(files[i]);if(stopping||current!==epoch)break;const out=await api('/api/library/import',{image},auth,controller.signal);saved++;if(out.duplicate)duplicates++;previews[i].querySelector('.spinner')?.remove()}catch(error){if(error.name==='AbortError')break;failed++;previews[i].classList.add('failed');if(error.status===403){signedOut('登录已过期，请重新登录');break}}}if(current===epoch){$('progress').textContent=(stopping?'已停止。':'')+'已确认保存 '+saved+' 张'+(duplicates?'（含 '+duplicates+' 张已存在的图片）':'')+'。';if(failed)$('libraryError').textContent=failed+' 张未能添加，请检查图片是否小于 6 MB 后重新选择。';if(stopping)$('progress').textContent+=' 下方以图库实际保存结果为准。';await library()}}catch(error){if(current===epoch)$('libraryError').textContent=error.message}finally{uploading=false;controller=null;$('logout').disabled=false;$('importButton').disabled=false;$('cancelImport').hidden=true}};
window.addEventListener('pagehide',()=>{stopping=true;controller?.abort()});
if(token){$('loginButton').disabled=true;setup().catch(e=>signedOut(e.status===403?'登录已过期，请重新登录':e.message)).finally(()=>$('loginButton').disabled=false)}
</script></body></html>
